<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مېنىڭ تۇنجى تور بېتىم</title>
    <style>
        body {
            font-family: "UKIJ Tuz Tor", "ALKATIP Tor", Tahoma, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        p {
            line-height: 1.8;
            font-size: 18px;
        }
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>كەلگىنىڭىزنى ئۆزئارا قارشى ئالىمىز!</h1>
        <p>بۇ HTML ۋە CSS ئارقىلىق ياسالغان ئاددىي بىر تور بەت كودى.</p>
        
        <h2>مېنىڭ قىزىقىشلىرىم:</h2>
        <ul>
            <li>پروگرامما تۈزۈش (HTML, CSS, JavaScript)</li>
            <li>كىتاب ئوقۇش</li>
            <li>تەبىئەت سېھرىدىن ھۇزۇرلىنىش</li>
        </ul>

        <a href="https://www.google.com" target="_blank" class="btn">گوگۇلدا ئىزدەش</a>
    </div>

</body>
</html>
